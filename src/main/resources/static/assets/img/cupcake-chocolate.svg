<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300" width="100%" height="100%" role="img" aria-label="Cupcake de Chocolate Belga">
  <rect width="300" height="300" fill="#f5ede7" rx="12"/>
  <!-- Forminha escura -->
  <path d="M85 185 L105 265 L195 265 L215 185 Z" fill="#5c3826" stroke="#382115" stroke-width="3"/>
  <line x1="115" y1="185" x2="125" y2="265" stroke="#452718" stroke-width="2"/>
  <line x1="150" y1="185" x2="150" y2="265" stroke="#452718" stroke-width="2"/>
  <line x1="185" y1="185" x2="175" y2="265" stroke="#452718" stroke-width="2"/>
  <!-- Cobertura trufada de chocolate -->
  <path d="M75 185 C70 145 110 135 125 125 C140 100 160 100 175 125 C190 135 230 145 225 185 C215 195 85 195 75 185 Z" fill="#4a2c1b" stroke="#2d170c" stroke-width="3"/>
  <ellipse cx="150" cy="115" rx="28" ry="18" fill="#3a2215" stroke="#2d170c" stroke-width="2"/>
  <!-- Granulados dourados e belgas -->
  <rect x="110" y="150" width="8" height="3" rx="1" fill="#dfab41" transform="rotate(25 110 150)"/>
  <rect x="145" y="130" width="8" height="3" rx="1" fill="#ffffff" transform="rotate(-15 145 130)"/>
  <rect x="175" y="155" width="8" height="3" rx="1" fill="#dfab41" transform="rotate(40 175 155)"/>
  <rect x="135" y="165" width="8" height="3" rx="1" fill="#dfab41" transform="rotate(-30 135 165)"/>
  <rect x="160" y="145" width="8" height="3" rx="1" fill="#ffffff" transform="rotate(10 160 145)"/>
  <!-- Cereja no topo -->
  <circle cx="150" cy="98" r="12" fill="#9e1227"/>
  <path d="M150 90 Q160 70 175 68" stroke="#336622" stroke-width="3" fill="none"/>
</svg>

