<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PIT Cupcakes - Entrar</title>
  <link rel="stylesheet" href="/assets/css/style.css">
</head>
<body data-page="login">
  <header><div class="header-container">
    <a class="brand-title" href="/index.html">PIT Cupcakes</a>
    <nav id="accountNavigation" aria-label="Conta"></nav>
    <p id="navigationMessage" role="status"></p>
  </div></header>
  <main class="account-page">
    <a href="/index.html">Voltar ao catálogo</a>
    <h1>Entrar</h1>
    <p id="formMessage" role="status" aria-live="polite"></p>
    <form id="accountForm">

<label for="email">E-mail</label><input id="email" name="email" type="email" autocomplete="username" required maxlength="254">
<label for="senha">Senha</label><input id="senha" name="senha" type="password" autocomplete="current-password" required aria-describedby="passwordLimits">
<p id="passwordLimits">De 8 a 64 caracteres Unicode e no máximo 72 bytes UTF-8. Espaços fazem parte da senha.</p>

<button class="btn" type="submit">Entrar</button>
</form>
<p><a id="loginLink" href="/paginas/conta/cadastro.html">Criar conta</a></p>
  </main>
  <script type="module" src="/assets/js/cliente/navegacao.js"></script>
  <script type="module" src="/assets/js/cliente/autenticacao.js"></script>
</body>
</html>
